# Ping ringan ke Supabase dua kali seminggu supaya projek pelan percuma tidak dijeda kerana tiada aktiviti.
name: Jaga Supabase aktif

on:
  schedule:
    - cron: "17 1 * * 1,4"   # Isnin & Khamis, 9:17 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping pangkalan data
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KUNCI=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          curl -fsS "$URL/rest/v1/program?select=id&limit=1" -H "apikey: $KUNCI" -o /dev/null -w "Status %{http_code}\n"
