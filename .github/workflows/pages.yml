# Terbit laman ke GitHub Pages setiap kali kod ditolak (push) ke cabang utama.
name: Terbit ke GitHub Pages

on:
  push:
    branches: [claude/festive-euler-4onz5j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sediakan fail laman (tanpa kod pelayan)
        run: |
          mkdir _site
          cp *.html *.js style.css manifest.webmanifest _site/
          cp -r vendor contoh ikon _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
