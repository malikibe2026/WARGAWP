<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laporan Kehadiran — DOSM WP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="ikon/favicon-32.png">
  <link rel="apple-touch-icon" href="ikon/ikon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DOSM WP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #e9edf3; color: #0e1b2e; }
    .lp-alat { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
      padding: 12px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid #dfe5ee; }
    .lp-alat label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #3c4a60; }
    .lp-alat select { font: 500 13px var(--font); padding: 7px 10px; border: 1px solid #dfe5ee; border-radius: 9px; background: #fff; color: #0e1b2e; }
    .kertas { width: 210mm; min-height: 297mm; margin: 22px auto 40px; background: #fff; padding: 16mm 16mm 18mm; box-shadow: 0 20px 50px -20px rgba(6,22,44,.35); }
    .lp-kepala { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 3px double #0b2f57; }
    .lp-jata { width: 74px; height: auto; flex: none; }
    .lp-logo { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg,#0b2f57,#124a85); color: #fff; flex: none; }
    .lp-logo svg { width: 28px; height: 28px; stroke-width: 2.6; }
    .lp-jabatan b { display: block; font-size: 15px; letter-spacing: .04em; }
    .lp-jabatan span { font-size: 12px; color: #3c4a60; letter-spacing: .06em; text-transform: uppercase; }
    .lp-ruj { margin-left: auto; text-align: right; font-size: 10.5px; color: #6b7a90; line-height: 1.5; }
    .lp-tajuk { text-align: center; margin: 18px 0 4px; font-size: 17px; letter-spacing: .08em; }
    .lp-subtajuk { text-align: center; margin: 0 0 16px; font-size: 13px; color: #3c4a60; }
    h3.lp-h { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: #0b2f57; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #dfe5ee; }
    table.lp { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    table.lp th, table.lp td { border: 1px solid #cfd8e3; padding: 5px 7px; text-align: left; vertical-align: top; }
    table.lp thead th { background: #0b2f57; color: #fff; font-weight: 700; font-size: 10.5px; letter-spacing: .03em; }
    table.lp tbody tr:nth-child(even) td { background: #f6f8fb; }
    table.lp td.n, table.lp th.n { text-align: center; width: 34px; }
    table.lp td.r, table.lp th.r { text-align: right; }
    table.lp td.t { white-space: nowrap; }
    table.butiran td:first-child { width: 32%; background: #f0f3f9; font-weight: 700; color: #3c4a60; }
    .lp-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .lp-kpi div { border: 1px solid #cfd8e3; border-radius: 8px; padding: 10px 12px; }
    .lp-kpi b { display: block; font-size: 22px; line-height: 1.1; }
    .lp-kpi span { font-size: 10.5px; color: #3c4a60; text-transform: uppercase; letter-spacing: .05em; }
    .lp-kpi .utama { background: #0b2f57; color: #fff; border-color: #0b2f57; }
    .lp-kpi .utama span { color: rgba(255,255,255,.75); }
    .lp-nota { font-size: 11px; color: #3c4a60; margin: 8px 0 0; }
    .bar { height: 7px; background: #e3e8f0; border-radius: 4px; overflow: hidden; min-width: 70px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, #1560b0, #3d8ee0); }
    .lp-tandatangan { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 34px; font-size: 11.5px; break-inside: avoid; }
    .lp-tandatangan .garis { border-bottom: 1px solid #0e1b2e; height: 46px; margin-bottom: 6px; }
    .lp-tandatangan p { margin: 3px 0; color: #3c4a60; }
    .lp-kaki { margin-top: 26px; padding-top: 8px; border-top: 1px solid #dfe5ee; font-size: 9.5px; color: #8a99af; display: flex; justify-content: space-between; }
    tr { break-inside: avoid; }
    @page { size: A4; margin: 14mm 12mm; }
    @media print {
      body { background: #fff; }
      .lp-alat, .toast { display: none !important; }
      .kertas { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
      table.lp thead { display: table-header-group; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media (max-width: 820px) { .kertas { width: auto; margin: 12px; padding: 18px; min-height: 0; } .lp-kpi { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <section id="lpLogin" class="panel panel-sempit" style="margin:40px auto" hidden>
    <div class="login-head">
      <div class="jata jata-lg" aria-hidden="true"><img src="ikon/jata-dosm.png" alt=""><i class="kilau"></i></div>
      <h2>Laporan Kehadiran</h2>
      <p class="muted">Log masuk pentadbir untuk menjana laporan.</p>
    </div>
    <form id="borangLogin" class="borang">
      <label>E-mel<input name="email" type="email" autocomplete="username" required></label>
      <label>Kata Laluan<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginRalat" class="error" hidden></p>
      <button class="btn btn-primary" style="width:100%">Masuk</button>
    </form>
  </section>

  <div id="lpUtama" hidden>
    <div class="lp-alat">
      <label>Sasaran peserta <select id="lpSasaran"></select></label>
      <label><input type="checkbox" id="lpTidakHadir" checked> Sertakan senarai tidak hadir</label>
      <button id="btnCetak" class="btn btn-primary btn-sm">
        <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span>Cetak / Simpan PDF</span>
      </button>
    </div>
    <article id="kertas" class="kertas"></article>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sasaran.js"></script>
  <script src="storage.js"></script>
  <script src="laporan.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
